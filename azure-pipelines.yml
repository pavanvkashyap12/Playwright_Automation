jobs:
  - job: Build
    steps:
      - task: PowerShell@2 # poweshell
        enabled: true
        displayName: "Install dependencies" # installing dependencies
        inputs:
          targetType: 'inline'
          script: 'npm ci' # command to install dependencies
          workingDirectory: tests/ # update accordingly
 
      - task: AzureCLI@2
        displayName: Run Playwright Test #to run playwright test 
        env:
          PLAYWRIGHT_SERVICE_URL: $(PLAYWRIGHT_SERVICE_URL)
          PLAYWRIGHT_SERVICE_RUN_ID: $(Build.DefinitionName) - $(Build.BuildNumber) - $(System.JobAttempt)
        inputs:
          azureSubscription: 'rahulshettyacademy' # Service connection used to authenticate this pipeline with Azure to use the service. go to project settings -> pipelines -> service connection -> new service connection -> azure resource manager -> select subscription -> next next
          #resource group -> select the group that you created earlier (it will show up) -> give a service connection name
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            npx playwright test  --config=playwright.service.config.js --workers=20        
          addSpnToEnvironment: true
          
 
      - task: PublishPipelineArtifact@1
        displayName: Upload Playwright report
        inputs:
          targetPath: tests/playwright-report/ # update accordingly
          artifact: 'Playwright tests'
          publishLocation: 'pipeline'